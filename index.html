<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Récré Arcade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lexend:wght@400;500;600;700&display=swap">
<style>
/* Mise en page : cahier Seyès + étiquettes autocollantes ; un seul thème clair, assumé. */
:root{
  color-scheme: light;
  --paper:#f8faff; --ink:#1d2747; --ink-2:#4a5578; --ink-3:#8a93b2;
  --line:#d9e2f6; --line-2:#c9c0ec; --margin:#f0a6a8;
  --card:#ffffff; --soft:#eef2fc;
  --blue:#2f6bff; --red:#e5383b; --green:#22a45d; --yellow:#ffd43b; --violet:#7b5cd6; --orange:#ff8a1f; --teal:#14a3a3; --pink:#e5579a;
  --ok:#22a45d; --bad:#e5383b;
  --f-display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Lexend", "Segoe UI", system-ui, sans-serif;
  --r:16px; --r-s:10px;
  --sh:0 4px 0 var(--ink);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:var(--f-body); font-size:15px; color:var(--ink); background-color:var(--paper);
  background-image:
    repeating-linear-gradient(0deg, transparent 0 31px, var(--line-2) 31px 32px),
    repeating-linear-gradient(0deg, transparent 0 7px, var(--line) 7px 8px),
    repeating-linear-gradient(90deg, transparent 0 31px, rgba(123,92,214,.10) 31px 32px);
  -webkit-tap-highlight-color: transparent;
}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);line-height:1.05;margin:0;text-wrap:balance}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding-block:14px 40px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* ---------- boutons ---------- */
.btn{appearance:none;border:2px solid var(--ink);background:var(--card);border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:transform .08s, box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,.gcard:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn.primary{background:var(--blue);color:#fff}
.btn.go{background:var(--green);color:#fff}
.btn.warn{background:var(--yellow)}
.btn.danger{background:var(--red);color:#fff}
.btn.big{font-size:1.15rem;padding:14px 22px;min-height:56px;font-family:var(--f-display);font-weight:800;letter-spacing:.01em}
.btn.small{min-height:34px;padding:5px 10px;font-size:.85rem;box-shadow:0 2px 0 var(--ink)}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;text-decoration:underline;text-underline-offset:3px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 3px 0 var(--ink)}
.chip{border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:600;cursor:pointer;font-size:.88rem}
.chip.on{background:var(--ink);color:#fff}
input.field{width:100%;border:2px solid var(--ink);border-radius:12px;padding:12px 14px;background:#fff;font-size:1.05rem;min-height:48px}
input.field::placeholder{color:var(--ink-3)}

/* ---------- surfaces ---------- */
.card{background:var(--card);border:2px solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.label{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ink-2)}
.muted{color:var(--ink-2)}
.center{text-align:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:12px}
.grow{flex:1;min-width:0}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--yellow);border:2px solid var(--ink);font-weight:700;font-size:.8rem}

/* ---------- barre ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:#fff}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
.bar .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:8px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));flex-wrap:wrap}
.logo{font-family:var(--f-display);font-weight:800;font-size:1.35rem;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.logo b{background:var(--yellow);color:var(--ink);padding:0 8px;border-radius:8px;transform:rotate(-3deg);display:inline-block}
.codechip{font-family:var(--f-display);font-weight:800;background:#fff;color:var(--ink);border-radius:10px;padding:2px 10px;letter-spacing:.15em;font-size:1.1rem}
.bar .btn{color:var(--ink);min-height:34px;padding:4px 10px;font-size:.85rem;box-shadow:0 2px 0 #000;border-color:#000}

/* ---------- accueil ---------- */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center;margin-top:18px}
.hero h1{font-size:clamp(2.6rem,7vw,4.8rem);font-weight:800}
.hero h1 span{background:linear-gradient(transparent 58%, var(--yellow) 58% 90%, transparent 90%)}
.hero p{font-size:1.1rem;color:var(--ink-2);max-width:34ch}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);cursor:pointer;padding:0}
.sw.on{outline:3px solid var(--ink);outline-offset:2px}
.minis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
.mini{border:2px solid var(--ink);border-radius:12px;padding:10px 8px;background:var(--card);text-align:center;font-weight:700;font-size:.8rem;display:flex;flex-direction:column;align-items:center;gap:6px}
.err{color:var(--red);font-weight:600;min-height:1.2em}

/* ---------- salon ---------- */
.lobby{display:grid;grid-template-columns:300px 1fr;gap:20px;margin-top:16px;align-items:start}
.plist{display:flex;flex-direction:column;gap:6px}
.pl{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;background:var(--soft)}
.pl.off{opacity:.45}
.pl .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .pts{font-variant-numeric:tabular-nums;font-weight:700}
.av{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:inline-grid;place-items:center;color:#fff;font-weight:800;font-size:.8rem;flex:none;font-family:var(--f-display);text-shadow:0 1px 0 rgba(0,0,0,.35)}
.av.lg{width:46px;height:46px;font-size:1.05rem}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.gcard{border:2px solid var(--ink);border-radius:var(--r);padding:14px;background:var(--card);cursor:pointer;display:flex;gap:12px;align-items:flex-start;text-align:left;box-shadow:0 3px 0 var(--ink);transition:transform .1s}
.gcard:hover{transform:translateY(-2px) rotate(-.4deg)}
.gcard.on{background:var(--gc);color:#fff;box-shadow:0 5px 0 var(--ink)}
.gcard.on .muted{color:rgba(255,255,255,.88)}
.gicon{width:46px;height:46px;flex:none;border-radius:12px;border:2px solid var(--ink);background:var(--gc);display:grid;place-items:center}
.gcard.on .gicon{background:#fff}
.gicon svg{width:28px;height:28px}
.gcard h3{font-size:1.2rem;margin-bottom:2px}
.gcard p{margin:0;font-size:.85rem}
.setrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:2px dashed var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .label{min-width:120px}
.chips{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- jeu : commun ---------- */
.ghead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0 12px}
.ghead h2{font-size:1.6rem}
.timer{min-width:56px;height:56px;border-radius:50%;border:3px solid var(--ink);background:var(--yellow);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.45rem;font-variant-numeric:tabular-nums;flex:none}
.tbar{height:10px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff}
.tbar i{display:block;height:100%;background:var(--orange);width:100%;transition:width .2s linear}
.bigq{font-family:var(--f-display);font-size:clamp(1.5rem,4vw,2.4rem);font-weight:800;text-align:center;margin:10px 0 18px;text-wrap:balance}
.wait{display:grid;place-items:center;gap:12px;min-height:40vh;text-align:center}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.pop{animation:pop .4s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.banner{border:2px solid var(--ink);border-radius:12px;padding:10px 14px;font-weight:700;background:var(--yellow)}
.banner.ok{background:#c9f2d8}.banner.bad{background:#ffd0d1}
.layout2{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}

/* podium */
.podium{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:24px 0 18px}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;width:min(30%,170px)}
.pod .blk{width:100%;border:2px solid var(--ink);border-radius:12px 12px 0 0;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:2rem;color:var(--ink)}
.pod .nm{font-weight:700;text-align:center;overflow-wrap:anywhere}
.pod .pts{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink-2)}

/* dessin */
.boardwrap{position:relative;max-width:calc((100vh - 200px) * 4 / 3);margin:0 auto;width:100%;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:#fff;box-shadow:var(--sh)}
.boardwrap canvas{display:block;width:100%;height:auto;aspect-ratio:4/3;touch-action:none;cursor:crosshair}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(29,39,71,.86);color:#fff;text-align:center;padding:20px}
.overlay h3{font-size:1.6rem}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.pal{display:flex;gap:4px;flex-wrap:wrap}
.pal button{width:28px;height:28px;border-radius:8px;border:2px solid var(--ink);cursor:pointer;padding:0}
.pal button.on{outline:3px solid var(--ink);outline-offset:1px;transform:scale(1.08)}
.sizes{display:flex;gap:4px}
.sizes button{width:34px;height:34px;border-radius:8px;border:2px solid var(--ink);background:#fff;cursor:pointer;display:grid;place-items:center;padding:0}
.sizes button.on{background:var(--yellow)}
.sizes i{display:block;border-radius:50%;background:var(--ink)}
.mask{font-family:var(--f-display);font-weight:800;font-size:clamp(1.3rem,3.6vw,2rem);letter-spacing:.32em;text-align:center;flex:1;min-width:0;overflow-wrap:anywhere}
.mask small{font-size:.8rem;letter-spacing:0;color:var(--ink-2);margin-left:6px;font-family:var(--f-body)}
.chat{display:flex;flex-direction:column;border:2px solid var(--ink);border-radius:14px;background:#fff;overflow:hidden;height:clamp(220px,46vh,520px)}
.msgs{flex:1;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:3px;font-size:.92rem}
.msgs .m{overflow-wrap:anywhere}
.msgs .m b{font-weight:700}
.msgs .sys{color:var(--ink-2);font-style:italic}
.msgs .okm{color:#fff;background:var(--ok);border-radius:8px;padding:2px 8px;font-weight:700}
.msgs .near{color:#9a5b00;background:#fff1c2;border-radius:8px;padding:2px 8px}
.msgs .gm{color:var(--green)}
.chat form{display:flex;border-top:2px solid var(--ink)}
.chat input{flex:1;min-width:0;border:0;padding:12px;font-size:1rem;outline:none}
.chat form button{border:0;border-left:2px solid var(--ink);background:var(--yellow);font-weight:700;padding:0 14px;cursor:pointer}
.wordpick{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}

/* quiz */
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans{border:3px solid var(--ink);border-radius:16px;padding:18px 16px;font-weight:700;font-size:1.1rem;cursor:pointer;color:#fff;box-shadow:0 4px 0 var(--ink);display:flex;align-items:center;gap:12px;text-align:left;min-height:84px}
.ans .k{width:34px;height:34px;flex:none;border-radius:8px;background:rgba(255,255,255,.25);display:grid;place-items:center;font-family:var(--f-display);font-weight:800}
.ans:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.ans.dim{opacity:.35}
.ans.sel{outline:4px solid var(--yellow);outline-offset:2px}
.ans.right{outline:4px solid var(--ok);outline-offset:2px;opacity:1}
.a0{background:var(--red)}.a1{background:var(--blue)}.a2{background:#d69a00}.a3{background:var(--green)}
.distr{display:flex;flex-direction:column;gap:6px}
.drow{display:flex;align-items:center;gap:8px}
.drow .b{height:22px;border:2px solid var(--ink);border-radius:6px;min-width:6px}
.board-mini{display:flex;flex-direction:column;gap:5px}

/* bombe */
.bomb{width:min(230px,58vw);aspect-ratio:1;margin:0 auto;position:relative;display:grid;place-items:center}
.bomb .body{width:84%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%, #4b5675, var(--ink) 60%);border:3px solid #000;display:grid;place-items:center;color:#fff;animation:tick 1s infinite}
.bomb .syl{font-family:var(--f-display);font-weight:800;font-size:clamp(2.4rem,9vw,3.6rem);letter-spacing:.06em;text-transform:uppercase;background:#fff;color:var(--ink);padding:0 14px;border-radius:12px;border:3px solid #000}
.bomb .fuse{position:absolute;top:2%;right:14%;width:22%;height:22%;border-top:6px solid #8a6d3b;border-right:6px solid #8a6d3b;border-radius:0 60% 0 0}
.bomb .spark{position:absolute;top:-1%;right:9%;width:18px;height:18px;border-radius:50%;background:var(--yellow);box-shadow:0 0 14px 6px var(--orange);animation:spark .25s infinite alternate}
@keyframes tick{50%{transform:scale(1.04)}}
@keyframes spark{to{transform:scale(1.5);opacity:.7}}
.boom{animation:boom .7s}
@keyframes boom{0%{transform:scale(1)}30%{transform:scale(1.5);filter:brightness(2)}100%{transform:scale(1)}}
.ring{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.bp{border:2px solid var(--ink);border-radius:12px;background:#fff;padding:6px 10px;display:flex;align-items:center;gap:8px;min-width:0;max-width:100%}
.bp.cur{background:var(--yellow);transform:scale(1.07);box-shadow:0 3px 0 var(--ink)}
.bp.dead{opacity:.35;text-decoration:line-through}
.bp .typ{font-family:var(--f-display);font-weight:700;color:var(--ink-2);max-width:12ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hearts{display:flex;gap:2px}
.hearts i{width:12px;height:12px;background:var(--red);border:1.5px solid var(--ink);border-radius:3px;transform:rotate(45deg)}
.hearts i.x{background:#fff}
.abc{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.abc span{width:24px;height:26px;border:2px solid var(--ink);border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:.8rem;background:#fff;color:var(--ink-3)}
.abc span.on{background:var(--green);color:#fff}
.bigin{font-family:var(--f-display);font-weight:800;font-size:1.6rem;text-transform:uppercase;letter-spacing:.04em;text-align:center}

/* bac */
.bletter{font-family:var(--f-display);font-weight:800;font-size:4.5rem;width:96px;height:96px;border:3px solid var(--ink);border-radius:20px;background:var(--yellow);display:grid;place-items:center;box-shadow:var(--sh);flex:none;transform:rotate(-4deg)}
.bacgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.bacf label{display:block;font-weight:700;margin-bottom:4px}
.vgroup{display:flex;align-items:center;gap:10px;padding:10px 12px;border:2px solid var(--ink);border-radius:12px;background:#fff}
.vgroup.no{background:#ffe1e2}
.vgroup.empty{opacity:.5}
.vgroup .v{font-weight:700;font-size:1.05rem;flex:1;min-width:0;overflow-wrap:anywhere}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px;border-bottom:2px dashed var(--line);text-align:left}
.tblwrap{overflow-x:auto}

/* imposteur / prefs / chaine */
.myword{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,7vw,3.2rem);text-align:center;background:var(--yellow);border:3px solid var(--ink);border-radius:16px;padding:6px 18px;display:inline-block;transform:rotate(-2deg);box-shadow:var(--sh)}
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.vp{border:2px solid var(--ink);border-radius:14px;background:#fff;padding:10px;display:flex;flex-direction:column;gap:6px;text-align:left;cursor:default}
.vp.can{cursor:pointer}
.vp.can:hover{background:var(--soft)}
.vp.sel{background:var(--ink);color:#fff}
.vp.out{opacity:.4}
.clues{display:flex;gap:4px;flex-wrap:wrap}
.clues span{background:var(--soft);border:1.5px solid var(--ink);border-radius:8px;padding:1px 8px;font-weight:600;color:var(--ink)}
.duel{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{border:3px solid var(--ink);border-radius:20px;padding:26px 18px;font-family:var(--f-display);font-weight:800;font-size:clamp(1.2rem,3.4vw,1.8rem);color:#fff;cursor:pointer;box-shadow:var(--sh);min-height:150px;display:grid;place-items:center;text-align:center;text-wrap:balance}
.opt.A{background:var(--red)}.opt.B{background:var(--blue)}
.opt.sel{outline:5px solid var(--yellow);outline-offset:3px}
.opt.dim{opacity:.45}
.pct{font-size:2.6rem}
.album{display:flex;flex-direction:column;gap:14px;max-width:720px;margin:0 auto}
.entry{display:flex;gap:10px;align-items:flex-start}
.entry .bub{border:2px solid var(--ink);border-radius:14px;background:#fff;padding:10px 14px;font-weight:600;font-size:1.1rem;flex:1;min-width:0;overflow-wrap:anywhere}
.entry img{display:block;width:100%;border-radius:8px;border:2px solid var(--ink)}
.prompt{border:3px solid var(--ink);border-radius:16px;background:#fff;padding:14px;text-align:center;font-family:var(--f-display);font-size:1.6rem;font-weight:800;margin-bottom:12px;overflow-wrap:anywhere}
.prompt img{max-width:100%;border-radius:10px;border:2px solid var(--ink)}

/* toast / voile */
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,520px)}
#toast div{background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25);animation:pop .3s}
.veil{position:fixed;inset:0;background:rgba(29,39,71,.75);z-index:50;display:grid;place-items:center;padding:20px}

@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .lobby{grid-template-columns:1fr}
  .layout2{grid-template-columns:1fr}
  .chat{height:clamp(200px,34vh,320px)}
}
@media (max-width:520px){
  .answers{grid-template-columns:1fr}
  .ans{min-height:62px;padding:12px}
  .duel{grid-template-columns:1fr}
  .opt{min-height:110px}
  .minis{grid-template-columns:repeat(2,1fr)}
  .bletter{width:72px;height:72px;font-size:3.2rem}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script>
/* ===================== OUTILS ===================== */
'use strict';
const VERSION = 1;
const PREFIX = 'recre-arcade-v1-';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[rnd(a.length)];

const Host = {
  room: null, conns: new Map(), last: new Map(), banned: new Set(), gs: null, def: null, flushT: null, tickT: null,
  init(code) {
    this.room = { code, hostId: S.me.id, players: [], game: null, sel: 'croquis', settings: {} };
    for (const k in GAMES) this.room.settings[k] = defaultSettings(k);
    this.addPlayer(S.me.id, S.me.name, S.me.color);
    clearInterval(this.tickT);
    this.tickT = setInterval(() => this.tick(), 200);
    this.dirty();
  },
  player(id) { return this.room.players.find(p => p.id === id); },
  addPlayer(id, name, color) {
    name = String(name || 'Joueur').trim().slice(0, 16) || 'Joueur';
    let n = name, i = 2;
    while (this.room.players.some(p => p.name.toLowerCase() === n.toLowerCase())) n = name.slice(0, 13) + ' ' + i++;
    const p = { id, name: n, color: AV_COLORS.includes(color) ? color : pick(AV_COLORS), score: 0, on: true };
    this.room.players.push(p);
    return p;
  },
  accept(conn) {
    conn.on('data', m => {
      if (!m || typeof m !== 'object') return;
      if (m.t === 'hello') this.hello(conn, m);
      else if (conn._pid) this.receive(conn._pid, m);
    });
    const gone = () => {
      if (conn._pid && this.conns.get(conn._pid) === conn) {
        this.conns.delete(conn._pid); this.last.delete(conn._pid);
        const p = this.player(conn._pid);
        if (p) { p.on = false; if (this.gs && this.def.leave) this.def.leave(this.gs, p.id, this.ctx); }
        this.dirty();
      }
    };
    conn.on('close', gone); conn.on('error', gone);
  },
  hello(conn, m) {
    const id = String(m.id || '').slice(0, 20);
    if (!id || this.banned.has(id)) { try { conn.send({ t: 'kick' }); } catch (e) {} setTimeout(() => conn.close(), 400); return; }
    let p = this.player(id);
    if (!p) {
      if (this.room.players.length >= 40) { try { conn.send({ t: 'reject', why: 'Salon complet (40 joueurs).' }); } catch (e) {} setTimeout(() => conn.close(), 400); return; }
      p = this.addPlayer(id, m.name, m.color);
    }
    p.on = true;
    const old = this.conns.get(id);
    if (old && old !== conn) { old._pid = null; try { old.close(); } catch (e) {} }
    conn._pid = id; this.conns.set(id, conn); this.last.delete(id);
    try { conn.send({ t: 'welcome', name: p.name }); } catch (e) {}
    if (this.gs) {
      if (!this.gs.ids.includes(id) && this.def.join) this.def.join(this.gs, id, this.ctx);
      if (this.def.resync) this.def.resync(this.gs, id, this.ctx);
    }
    this.dirty();
  },
  sendTo(pid, msg) {
    if (pid === this.room.hostId) { const copy = JSON.parse(JSON.stringify(msg)); setTimeout(() => Client.receive(copy), 0); return; }
    const c = this.conns.get(pid);
    if (c && c.open) { try { c.send(msg); } catch (e) {} }
  },
  receive(pid, m) {
    if (m.t !== 'act' || !m.a || typeof m.a !== 'object') return;
    const a = m.a;
    if (a.lobby) { this.lobbyAct(pid, a); return; }
    if (this.gs && this.gs.ids.includes(pid)) {
      try { this.def.action(this.gs, pid, a, this.ctx); } catch (e) { console.error(e); }
      this.dirty();
    }
  },
  lobbyAct(pid, a) {
    if (pid !== this.room.hostId) return;
    const R = this.room;
    switch (a.lobby) {
      case 'sel': if (GAMES[a.g] && !R.game) R.sel = a.g; break;
      case 'set': {
        const d = GAMES[R.sel], st = d.settings.find(x => x.k === a.k);
        if (st) {
          if (st.multi) {
            const arr = R.settings[R.sel][a.k];
            const i = arr.indexOf(a.v);
            if (i >= 0) { if (arr.length > (st.min || 1)) arr.splice(i, 1); }
            else if (st.opts.some(o => o[0] === a.v) && arr.length < (st.max || 99)) arr.push(a.v);
          } else if (st.opts.some(o => o[0] === a.v)) R.settings[R.sel][a.k] = a.v;
        }
        break;
      }
      case 'start': this.start(); break;
      case 'stop': this.stop(); break;
      case 'kick': {
        if (a.id === R.hostId) break;
        this.banned.add(a.id);
        this.sendTo(a.id, { t: 'kick' });
        const c = this.conns.get(a.id);
        setTimeout(() => { try { c && c.close(); } catch (e) {} }, 300);
        this.conns.delete(a.id); this.last.delete(a.id);

  lobbyView() {

        catch (e) { console.error(e); g = { spect: true }; }
        g.type = this.room.game;
      }
      const key = JSON.stringify([l, g]);
      if (this.last.get(p.id) === key) continue;
      this.last.set(p.id, key);
      this.sendTo(p.id, { t: 'state', l, g, n: Date.now() });
    }
  }
};
Host.ctx = {
  ev: (e, except) => Host.ev(e, except),
  to: (pid, e) => Host.sendTo(pid, { t: 'ev', e }),
  on: id => { const p = Host.player(id); return !!(p && p.on); },
  name: id => (Host.player(id) || { name: '?' }).name,
  isHost: id => id === Host.room.hostId,
  dirty: () => Host.dirty(),
  online: ids => ids.filter(id => Host.ctx.on(id)),
  finish(gs, scores) {
    gs.phase = 'end';
    gs.final = Object.entries(scores).map(([id, pts]) => ({ id, pts: Math.round(pts) })).sort((a, b) => b.pts - a.pts);
    if (!gs.awarded) { gs.awarded = true; for (const f of gs.final) { const p = Host.player(f.id); if (p) p.score += f.pts; } }
  }
};
function defaultSettings(k) {
  const o = {};
  for (const s of GAMES[k].settings) o[s.k] = s.multi ? s.def.slice() : s.def;

}

/* ===================== RÉSEAU CLIENT ===================== */
function genCode() { const A = 'ABCDEFGHJKMNPQRSTUVWXYZ'; let c = ''; for (let i = 0; i < 4; i++) c += A[rnd(A.length)]; return c; }
function netErrorText(err) {
  const t = err && err.type;
  if (t === 'browser-incompatible') return 'Ce navigateur ne permet pas le jeu en réseau.';
  if (t === 'network' || t === 'server-error' || t === 'socket-error' || t === 'socket-closed') return 'Impossible de joindre le serveur de mise en relation. Vérifie la connexion internet.';
  if (t === 'peer-unavailable') return 'Salon introuvable. Vérifie le code.';
  return 'Erreur réseau (' + (t || 'inconnue') + ').';
}
function createRoom() {
  if (typeof Peer === 'undefined') { S.homeMsg = 'Module réseau non chargé. Vérifie la connexion internet.'; render(); return; }
  S.homeMsg = 'Création du salon…'; render();
  const code = genCode();
  const peer = new Peer(PREFIX + code, peerOpts());
  peer.on('open', () => {
    S.peer = peer; S.role = 'host'; S.code = code; S.joined = true; S.homeMsg = '';
    Host.init(code);
    history.replaceState(null, '', location.pathname + '?' + keepParams() + 'salle=' + code);
  });
  peer.on('connection', conn => Host.accept(conn));
  peer.on('disconnected', () => { setTimeout(() => { try { if (!peer.destroyed) peer.reconnect(); } catch (e) {} }, 1500); });
  peer.on('error', err => {
    if (err.type === 'unavailable-id') { peer.destroy(); createRoom(); return; }
    if (S.role === 'host' && (err.type === 'peer-unavailable')) return;
    if (S.role !== 'host') { S.homeMsg = netErrorText(err); render(); }
    else toast(netErrorText(err));
  });
}
function keepParams() {
  const q = new URLSearchParams(location.search); q.delete('salle');
  const s = q.toString(); return s ? s + '&' : '';
}
function joinRoom(code) {
  if (typeof Peer === 'undefined') { S.homeMsg = 'Module réseau non chargé. Vérifie la connexion internet.'; render(); return; }
  code = String(code || '').toUpperCase().replace(/[^A-Z]/g, '');
  if (code.length !== 4) { S.homeMsg = 'Le code fait 4 lettres.'; render(); return; }
  S.code = code; S.role = 'client'; S.homeMsg = 'Connexion au salon ' + code + '…'; render();
  const go = () => connectHost();
  if (S.peer && !S.peer.destroyed && S.peer.open) go();
  else {
    const peer = new Peer(peerOpts());
    S.peer = peer;
    peer.on('open', go);
    peer.on('disconnected', () => { setTimeout(() => { try { if (!peer.destroyed) peer.reconnect(); } catch (e) {} }, 1500); });
    peer.on('error', err => {
      if (err.type === 'peer-unavailable') {
        if (S.joined) return;
        S.role = null; S.homeMsg = 'Salon ' + code + ' introuvable. Vérifie le code.'; render(); return;
      }
      if (!S.joined) { S.role = null; S.homeMsg = netErrorText(err); render(); }
    });
  }
}
function connectHost() {
  const conn = S.peer.connect(PREFIX + S.code, { reliable: true });
  let opened = false;
  const to = setTimeout(() => { if (!opened) { try { conn.close(); } catch (e) {} if (S.joined) retryHost(); else { S.role = null; S.homeMsg = 'Pas de réponse du salon ' + S.code + '.'; render(); } } }, 10000);
  conn.on('open', () => {
    opened = true; clearTimeout(to);
    S.conn = conn; S.retries = 0;
    conn.send({ t: 'hello', id: S.me.id, name: S.me.name, color: S.me.color, v: VERSION });
  });
  conn.on('data', m => Client.receive(m));
  const lost = () => { if (S.conn === conn) { S.conn = null; if (!S.leaving) retryHost(); } };
  conn.on('close', lost); conn.on('error', lost);
}
function retryHost() {
  if (S.leaving || S.role !== 'client') return;
  S.retries++;
  showVeil(S.retries > 12 ? '' : 'Connexion perdue. Reconnexion…');
  if (S.retries > 12) { leave('L’hôte a quitté ou la connexion est perdue.'); return; }
  setTimeout(() => { if (!S.leaving && !S.conn) { try { if (S.peer.disconnected) S.peer.reconnect(); } catch (e) {} connectHost(); } }, 2500);
}
function showVeil(msg) {
  let v = $('#veil');
  if (!msg) { v && v.remove(); return; }
  if (!v) { v = document.createElement('div'); v.id = 'veil'; v.className = 'veil'; document.body.appendChild(v); }
  v.innerHTML = `<div class="card center" style="max-width:340px"><h3 class="dots">${esc(msg)}</h3><p class="muted">Garde cette page ouverte.</p><button class="btn small" data-act="leave">Quitter</button></div>`;
}
function leave(msg) {
  S.leaving = true;

  try { S.conn && S.conn.close(); } catch (e) {}
  try { S.peer && S.peer.destroy(); } catch (e) {}
  Object.assign(S, { role: null, lobby: null, gv: null, peer: null, conn: null, joined: false, screenKey: null, cache: {}, tEnd: null, auto: null, homeMsg: msg || '' });
  Board.shared = null;

function act(a) {
  if (isHost()) Host.receive(S.me.id, { t: 'act', a });

}

const Client = {
  receive(m) {
    if (!m || typeof m !== 'object') return;
    switch (m.t) {
      case 'welcome': S.joined = true; try { sessionStorage.setItem('ra-room', S.code); } catch (e) {} S.homeMsg = ''; showVeil(''); if (m.name) S.me.shownName = m.name;
        history.replaceState(null, '', location.pathname + '?' + keepParams() + 'salle=' + S.code); break;
      case 'state': {
        const prevGame = S.lobby && S.lobby.game;
        S.lobby = m.l; S.gv = m.g;
        if (m.g && m.g.end) { S.tEnd = Date.now() + (m.g.end - m.n); S.tDur = m.g.dur || 0; } else { S.tEnd = null; }
        if (prevGame !== m.l.game) { S.screenKey = null; S.cache = {}; }
        render(); break;
      }
      case 'ev': {
        if (m.e.k === 'reset') { S.cache = {}; Board.shared = null; S.screenKey = null; return; }
        const g = S.lobby && S.lobby.game && GAMES[S.lobby.game];
        if (g && g.onEv) g.onEv(m.e);
        break;
      }
      case 'note': toast(m.x); break;
      case 'kick': leave('Tu as été retiré du salon.'); break;
      case 'reject': leave(m.why || 'Connexion refusée.'); break;
    }
  }
};

}

    const g = GAMES[L.game];

/* ===================== TABLEAU DE DESSIN ===================== */
const PALETTE = ['#1d2747', '#000000', '#8a93b2', '#ffffff', '#e5383b', '#ff8a1f', '#ffd43b', '#a3e635', '#22a45d', '#14a3a3', '#7dd3fc', '#2f6bff', '#7b5cd6', '#e5579a', '#f6c7a8', '#8a5a2b'];
const SIZES = [3, 7, 14, 28];
const W = 800, H = 600;
class Board {
  static get() { return Board.shared || (Board.shared = new Board()); }
  constructor() {
    this.cv = document.createElement('canvas'); this.cv.width = W; this.cv.height = H;
    this.g = this.cv.getContext('2d', { willReadFrequently: true });
    this.ops = []; this.byId = {}; this.edit = false; this.send = null;
    this.color = '#1d2747'; this.size = 7; this.tool = 'pen'; this.n = 0; this.cur = null; this.pend = null; this.ft = null;
    this.wipe(); this.bind();
  }
  wipe() { this.g.fillStyle = '#fff'; this.g.fillRect(0, 0, W, H); }

  line(c, w, p, prev) {

    for (; i < p.length; i += 2) g.lineTo(p[i], p[i + 1]);
    g.stroke();
  }
  applyOp(o) { if (o.k === 's') this.line(o.c, o.w, o.p, null); else if (o.k === 'f') this.fill(o.x, o.y, o.c); }
  redraw(ops) {
    this.ops = (ops || []).map(o => o.k === 's' ? { ...o, p: o.p.slice() } : { ...o });
    this.byId = {}; for (const o of this.ops) if (o.id) this.byId[o.id] = o;
    this.cur = null; this.wipe(); for (const o of this.ops) this.applyOp(o);
  }
  remoteSeg(e) {
    let o = this.byId[e.id];
    if (!o) { o = { k: 's', id: e.id, c: e.c, w: e.w, p: [] }; this.byId[e.id] = o; this.ops.push(o); this.line(e.c, e.w, e.p, null); }
    else if (o.p.length >= 2) this.line(e.c, e.w, e.p, [o.p[o.p.length - 2], o.p[o.p.length - 1]]);
    else this.line(e.c, e.w, e.p, null);
    o.p.push(...e.p);
  }
  remoteOp(o) { this.ops.push(o); this.applyOp(o); }
  pos(e) {
    const r = this.cv.getBoundingClientRect();
    return [Math.max(0, Math.min(W - 1, Math.round((e.clientX - r.left) / r.width * W))), Math.max(0, Math.min(H - 1, Math.round((e.clientY - r.top) / r.height * H)))];
  }
  bind() {
    const cv = this.cv;
    cv.addEventListener('pointerdown', e => {
      if (!this.edit) return;
      e.preventDefault();
      try { cv.setPointerCapture(e.pointerId); } catch (err) {}
      const [x, y] = this.pos(e);
      if (this.tool === 'fill') { const o = { k: 'f', x, y, c: this.color }; this.ops.push(o); this.applyOp(o); if (this.send) this.send({ a: 'fill', o }); return; }
      const er = this.tool === 'eraser';
      const c = er ? '#ffffff' : this.color, w = er ? Math.max(18, this.size * 2.2) : this.size;
      const id = S.me.id.slice(0, 5) + '-' + (++this.n) + '-' + rnd(1e5);
      this.cur = { k: 's', id, c, w, p: [x, y] }; this.ops.push(this.cur); this.byId[id] = this.cur;
      this.line(c, w, [x, y], null);
      if (this.send) { this.pend = { id, c, w, p: [x, y] }; this.schedule(); }
    });
    cv.addEventListener('pointermove', e => {
      if (!this.cur) return;
      const list = (e.getCoalescedEvents && e.getCoalescedEvents().length) ? e.getCoalescedEvents() : [e];
      for (const ev of list) {
        const [x, y] = this.pos(ev), p = this.cur.p, L = p.length;
        if (Math.abs(p[L - 2] - x) + Math.abs(p[L - 1] - y) < 3) continue;
        this.line(this.cur.c, this.cur.w, [x, y], [p[L - 2], p[L - 1]]);
        p.push(x, y);
        if (this.pend && this.pend.id === this.cur.id) this.pend.p.push(x, y);
      }
      this.schedule();
    });
    const up = () => { if (!this.cur) return; this.cur = null; this.flush(); };
    cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up); cv.addEventListener('lostpointercapture', up);
  }
  schedule() { if (!this.send || this.ft) return; this.ft = setTimeout(() => { this.ft = null; this.flush(); }, 45); }
  flush() { if (!this.send || !this.pend || !this.pend.p.length) return; this.send({ a: 'seg', id: this.pend.id, c: this.pend.c, w: this.pend.w, p: this.pend.p }); this.pend.p = []; }
  undo() { if (!this.ops.length) return; this.flush(); this.redraw(this.ops.slice(0, -1)); if (this.send) this.send({ a: 'undo' }); }

  fill(x, y, hex) {
    x = Math.max(0, Math.min(W - 1, x | 0)); y = Math.max(0, Math.min(H - 1, y | 0));
    const im = this.g.getImageData(0, 0, W, H), d = im.data, s = (y * W + x) * 4;
    const tr = d[s], tg = d[s + 1], tb = d[s + 2];
    const r = parseInt(hex.slice(1, 3), 16), gg = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    if (Math.abs(tr - r) + Math.abs(tg - gg) + Math.abs(tb - b) < 8) return;
    const seen = new Uint8Array(W * H), st = [y * W + x];
    while (st.length) {
      const i = st.pop(); if (seen[i]) continue; seen[i] = 1;
      const j = i * 4;
      if (Math.abs(d[j] - tr) + Math.abs(d[j + 1] - tg) + Math.abs(d[j + 2] - tb) > 110) continue;
      d[j] = r; d[j + 1] = gg; d[j + 2] = b; d[j + 3] = 255;
      const px = i % W;
      if (px > 0) st.push(i - 1); if (px < W - 1) st.push(i + 1);
      if (i >= W) st.push(i - W); if (i < W * H - W) st.push(i + W);
    }
    this.g.putImageData(im, 0, 0);
  }
  img() { return this.cv.toDataURL('image/jpeg', 0.6); }
}
function toolsHTML(b) {

/* ---------- 1. CROQUIS EXPRESS ---------- */
GAMES.croquis = {
  name: 'Croquis Express', color: '#2f6bff', min: 2,
  desc: 'Un joueur dessine, les autres devinent le mot.',
  rules: 'Chacun dessine à tour de rôle. Tape le mot dans le chat : plus tu trouves vite, plus tu marques.',
  settings: [
    { k: 'rounds', label: 'Tours', opts: [[1, '1'], [2, '2'], [3, '3']], def: 1 },
    { k: 'time', label: 'Temps de dessin', opts: [[60, '60 s'], [80, '80 s'], [100, '100 s'], [120, '120 s']], def: 80 },
    { k: 'theme', label: 'Mots', opts: [['mix', 'Mélange'], ['classique', 'Classiques'], ['techno', 'Techno']], def: 'mix' }
  ],
  create(ids, set, ctx) {
    const pool = set.theme === 'techno' ? WORDS_TECHNO : set.theme === 'classique' ? WORDS_CLASSIQUE : WORDS_CLASSIQUE.concat(WORDS_TECHNO);
    const gs = { ids: ids.slice(), order: ids.slice(), set, pool: shuffle(pool), round: 1, ti: -1, t: 0, scores: Object.fromEntries(ids.map(i => [i, 0])), chat: [], mid: 0, ops: [], byId: {} };
    this.next(gs, ctx);
    return gs;
  },
  draw3(gs) { const out = []; while (out.length < 3) { if (!gs.pool.length) gs.pool = shuffle(WORDS_CLASSIQUE); const w = gs.pool.pop(); if (!out.includes(w)) out.push(w); } return out; },
  sys(gs, x, k = 's', vis = 'all', f = null) { gs.chat.push({ i: ++gs.mid, k, x, vis, f }); if (gs.chat.length > 80) gs.chat.shift(); },
  next(gs, ctx) {
    let found = false;
    for (let g = 0; g < 200; g++) {
      gs.ti++;
      if (gs.ti >= gs.order.length) { gs.ti = 0; gs.round++; }
      if (gs.round > gs.set.rounds) break;
      if (ctx.on(gs.order[gs.ti])) { found = true; break; }
    }
    if (!found) { ctx.finish(gs, gs.scores); return; }
    gs.t++; gs.drawer = gs.order[gs.ti]; gs.choices = this.draw3(gs); gs.phase = 'choose';
    gs.end = Date.now() + 12000; gs.dur = 12000; gs.word = null; gs.ops = []; gs.byId = {}; gs.guessed = {}; gs.turnPts = {}; gs.revealed = []; gs.hints = [];
    ctx.ev({ k: 'ops', ops: [] });
    this.sys(gs, ctx.name(gs.drawer) + ' choisit un mot.');
  },
  startDraw(gs, i, ctx) {
    gs.word = gs.choices[i] || gs.choices[0]; gs.phase = 'draw';
    gs.dur = gs.set.time * 1000; gs.end = Date.now() + gs.dur;
    const idx = [...gs.word].map((c, j) => /[a-zà-ÿœæ0-9]/i.test(c) ? j : -1).filter(j => j >= 0);
    const nh = Math.min(3, Math.floor(idx.length / 3));
    gs.hintPos = shuffle(idx).slice(0, nh);
    gs.hints = [0.45, 0.65, 0.82].slice(0, nh).map(f => Date.now() + gs.dur * f);
    this.sys(gs, ctx.name(gs.drawer) + ' dessine !');
  },
  mask(gs) { return [...gs.word].map((c, j) => /[a-zà-ÿœæ0-9]/i.test(c) ? (gs.revealed.includes(j) ? c : '_') : c).join(''); },
  endTurn(gs, ctx) {
    gs.phase = 'reveal'; gs.dur = 5000; gs.end = Date.now() + gs.dur;
    this.sys(gs, 'Le mot était : ' + gs.word, 'ok');
  },
  action(gs, pid, a, ctx) {
    const dr = pid === gs.drawer;
    switch (a.a) {
      case 'pick': if (dr && gs.phase === 'choose') this.startDraw(gs, a.i | 0, ctx); break;
      case 'seg': {
        if (!dr || gs.phase !== 'draw' || !okPts(a.p) || !isHex(a.c) || !(a.w > 0 && a.w < 80) || typeof a.id !== 'string') return;
        let o = gs.byId[a.id];
        if (!o) { o = { k: 's', id: a.id.slice(0, 30), c: a.c, w: a.w, p: [] }; gs.byId[a.id] = o; gs.ops.push(o); }
        o.p.push(...a.p);
        ctx.ev({ k: 'seg', id: o.id, c: o.c, w: o.w, p: a.p }, pid);
        break;
      }
      case 'fill': {
        const o = a.o; if (!dr || gs.phase !== 'draw' || !o || !isHex(o.c)) return;
        const op = { k: 'f', x: o.x | 0, y: o.y | 0, c: o.c }; gs.ops.push(op); ctx.ev({ k: 'op', op }, pid); break;
      }
      case 'undo': if (dr && gs.phase === 'draw' && gs.ops.length) { const o = gs.ops.pop(); if (o.id) delete gs.byId[o.id]; ctx.ev({ k: 'ops', ops: gs.ops }, pid); } break;
      case 'clear': if (dr && gs.phase === 'draw') { gs.ops = []; gs.byId = {}; ctx.ev({ k: 'ops', ops: [] }, pid); } break;
      case 'msg': {
        const x = String(a.x || '').trim().slice(0, 80); if (!x) return;
        if (gs.phase === 'draw') {
          if (dr) return;
          if (gs.guessed[pid] != null) { this.sys(gs, x, 'g', 'g', pid); return; }
          const g = letters(x), w = letters(gs.word);
          if (g === w) {
            const rem = Math.max(0, (gs.end - Date.now()) / gs.dur);
            const first = Object.keys(gs.guessed).length === 0;
            const pts = Math.round(100 + 300 * rem) + (first ? 50 : 0);
            gs.guessed[pid] = pts; gs.scores[pid] = (gs.scores[pid] || 0) + pts; gs.turnPts[pid] = pts;
            gs.scores[gs.drawer] = (gs.scores[gs.drawer] || 0) + 50; gs.turnPts[gs.drawer] = (gs.turnPts[gs.drawer] || 0) + 50;
            this.sys(gs, ctx.name(pid) + ' a trouvé !', 'ok');
            ctx.to(pid, { k: 'found' });
            const need = ctx.online(gs.ids).filter(id => id !== gs.drawer);
            if (need.every(id => gs.guessed[id] != null)) this.endTurn(gs, ctx);
            return;
          }
          if (w.length >= 3 && g.includes(w)) { this.sys(gs, 'Ton message contient le mot : il reste caché.', 'near', pid); return; }
          if (w.length >= 4 && lev(g, w) <= (w.length > 7 ? 2 : 1)) { this.sys(gs, x, 'm', 'all', pid); this.sys(gs, '« ' + x + ' » : tu y es presque !', 'near', pid); return; }
        }
        this.sys(gs, x, 'm', 'all', pid);
        break;
      }
    }
  },
  tick(gs, now, ctx) {
    if (gs.phase === 'choose') {
      if (!ctx.on(gs.drawer)) { this.next(gs, ctx); return true; }
      if (now >= gs.end) { this.startDraw(gs, rnd(3), ctx); return true; }
    } else if (gs.phase === 'draw') {
      if (!ctx.on(gs.drawer)) { this.sys(gs, ctx.name(gs.drawer) + ' a quitté.'); this.endTurn(gs, ctx); return true; }
      if (gs.hints.length && now >= gs.hints[0]) { gs.hints.shift(); gs.revealed.push(gs.hintPos.shift()); return true; }
      if (now >= gs.end) { this.endTurn(gs, ctx); return true; }
    } else if (gs.phase === 'reveal' && now >= gs.end) { this.next(gs, ctx); return true; }
    return false;
  },
  join(gs, pid) { gs.ids.push(pid); gs.order.push(pid); gs.scores[pid] = 0; },
  resync(gs, pid, ctx) { ctx.to(pid, { k: 'ops', ops: gs.ops }); },
  view(gs, pid, ctx) {
    const dr = pid === gs.drawer, found = gs.guessed[pid] != null;
    const show = gs.word && (gs.phase === 'reveal' || dr || found);
    return {
      phase: gs.phase, t: gs.t, round: Math.min(gs.round, gs.set.rounds), rounds: gs.set.rounds, drawer: gs.drawer, me: dr, found,
      choices: dr && gs.phase === 'choose' ? gs.choices : null,
      word: show ? gs.word : null, mask: gs.word && !show ? this.mask(gs) : null,
      end: gs.end, dur: gs.dur, guessed: Object.keys(gs.guessed), scores: gs.scores, turnPts: gs.phase === 'reveal' ? gs.turnPts : null,
      chat: gs.chat.filter(m => m.vis === 'all' || m.vis === pid || (m.vis === 'g' && (found || dr))).slice(-40).map(m => ({ i: m.i, k: m.k, x: m.x, f: m.f })),
      ids: gs.ids
    };
  },
  onEv(e) {
    const b = Board.get();
    if (e.k === 'seg') b.remoteSeg(e);
    else if (e.k === 'op') b.remoteOp(e.op);
    else if (e.k === 'ops') b.redraw(e.ops);
    else if (e.k === 'found') sfx.ok();
  },
  render(v) {
    scr('cq-' + v.t, `
      <div class="ghead"><span class="tag" id="cqRound"></span><div class="mask" id="cqMask"></div>${timerEl()}</div>
      <div class="layout2">
        <div><div class="boardwrap" id="cqBoard"><div class="overlay" id="cqOver" hidden></div></div><div class="tools" id="cqTools" hidden></div></div>
        <aside class="col">
          <div class="chat"><div class="msgs" id="cqMsgs" aria-live="polite"></div>
            <form id="cqForm"><input id="cqIn" maxlength="80" autocomplete="off" placeholder="Ta proposition…"><button type="submit">Envoyer</button></form></div>
          <div class="card" style="padding:10px"><div class="plist" id="cqPlayers"></div></div>
        </aside>
      </div>`, st => {
      Board.get().mount($('#cqBoard'));
      $('#cqForm').addEventListener('submit', e => { e.preventDefault(); const i = $('#cqIn'); if (i.value.trim()) act({ a: 'msg', x: i.value }); i.value = ''; });
    });
    const b = Board.get();
    if (!$('#cqBoard').contains(b.cv)) b.mount($('#cqBoard'));
    b.edit = v.me && v.phase === 'draw'; b.send = b.edit ? m => act(m) : null; S.activeBoard = b;
    const tools = $('#cqTools');
    if (b.edit) { if (tools.hidden || !tools.firstElementChild) tools.innerHTML = toolsHTML(b); tools.hidden = false; } else tools.hidden = true;
    $('#cqRound').textContent = `Tour ${v.round}/${v.rounds}`;
    const mk = $('#cqMask');
    const mtxt = v.word ? v.word : v.mask ? v.mask.replace(/ /g, '  ') : '';
    const mcount = v.mask ? [...v.mask].filter(c => c === '_' || /[a-zà-ÿ]/i.test(c)).length : 0;
    mk.innerHTML = v.phase === 'choose' ? '<span class="muted" style="letter-spacing:0;font-size:1.1rem">Choix du mot…</span>' : esc(mtxt) + (v.mask ? `<small>${mcount} lettres</small>` : '');
    const ov = $('#cqOver');
    let oh = '', ok = v.phase + (v.choices ? 'c' : '');
    if (v.phase === 'choose') {
      oh = v.me ? `<div><h3>Choisis ton mot</h3><div class="wordpick">${v.choices.map((w, i) => `<button class="btn big warn" data-act="cq-pick" data-i="${i}">${esc(w)}</button>`).join('')}</div></div>`
        : `<div>${avatar(pl(v.drawer), 'lg')}<h3 style="margin-top:8px" class="dots">${pnm(v.drawer)} choisit un mot</h3></div>`;
    } else if (v.phase === 'reveal') {
      const tp = Object.entries(v.turnPts || {}).sort((a, b) => b[1] - a[1]);
      ok += tp.length;
      oh = `<div><p class="label" style="color:#fff">Le mot était</p><h3 style="font-size:2.2rem">${esc(v.word)}</h3><div class="col" style="gap:4px;margin-top:12px">${tp.length ? tp.map(([id, p]) => `<div>${pnm(id)} <b>+${p}</b></div>`).join('') : '<div>Personne n’a trouvé.</div>'}</div></div>`;

    ov.hidden = !oh;

    $('#cqPlayers').innerHTML = ps.map(({ id, s }) => { const p = pl(id); const g = v.guessed.includes(id); return `<div class="pl ${p.on ? '' : 'off'}" style="${g ? 'background:#c9f2d8' : ''}">${avatar(p)}<span class="nm">${esc(p.name)}${id === v.drawer ? ' · <b>dessine</b>' : ''}</span><span class="pts">${s}</span></div>`; }).join('');

      ms.innerHTML = v.chat.map(m => m.k === 's' ? `<div class="m sys">${esc(m.x)}</div>` : m.k === 'ok' ? `<div class="m okm">${esc(m.x)}</div>` : m.k === 'near' ? `<div class="m near">${esc(m.x)}</div>` : `<div class="m ${m.k === 'g' ? 'gm' : ''}"><b style="color:${esc(pl(m.f).color)}">${pnm(m.f)}</b> ${esc(m.x)}</div>`).join('');
      ms.scrollTop = ms.scrollHeight;

  },
  click(a, b) { if (a === 'cq-pick') act({ a: 'pick', i: +b.dataset.i }); }

/* ---------- 2. GRIBOUILLIS EN CHAÎNE ---------- */
const STARTERS = ['Un chat qui fait du ski', 'Le prof de techno sur une fusée', 'Une girafe à la cantine', 'Un robot qui pleure des frites', 'Un dragon qui passe le brevet', 'Une pizza qui fait du surf', 'Un fantôme dans le bus scolaire', 'Un pingouin au soleil', 'Une vache astronaute', 'Le collège sous la neige', 'Un escargot champion de course', 'Une éolienne qui danse', 'Un dinosaure qui joue du piano', 'Une sorcière sur une trottinette', 'Un requin dans une baignoire'];
GAMES.chaine = {
  name: 'Gribouillis en chaîne', color: '#14a3a3', min: 2,
  desc: 'Phrase, dessin, phrase… et le message déraille.',
  rules: 'Écris une phrase. Le joueur suivant la dessine, le suivant décrit le dessin… On découvre toutes les chaînes à la fin.',
  settings: [
    { k: 'steps', label: 'Étapes par chaîne', opts: [[4, '4'], [6, '6'], [8, '8'], [99, 'Tout le monde']], def: 6 },
    { k: 'tdraw', label: 'Temps de dessin', opts: [[60, '60 s'], [90, '90 s'], [120, '120 s']], def: 90 },
    { k: 'ttext', label: 'Temps d’écriture', opts: [[30, '30 s'], [45, '45 s'], [60, '60 s']], def: 45 }
  ],
  create(ids, set, ctx) {
    const n = ids.length;
    const gs = { ids: ids.slice(), set, n, K: Math.min(n, set.steps), step: 0, albums: ids.map(id => ({ owner: id, e: [] })), subs: {} };
    this.startStep(gs, ctx);
    return gs;
  },
  typeOf(k) { return k === 0 ? 'write' : k % 2 === 1 ? 'draw' : 'desc'; },
  albumOf(gs, pid, k) { const p = gs.ids.indexOf(pid); return ((p - k) % gs.n + gs.n) % gs.n; },
  startStep(gs, ctx) {
    gs.phase = this.typeOf(gs.step);
    gs.dur = (gs.phase === 'draw' ? gs.set.tdraw : gs.set.ttext) * 1000; gs.end = Date.now() + gs.dur; gs.subs = {};
    if (gs.step > 0) for (const pid of gs.ids) this.sendPrompt(gs, pid, ctx);
  },
  sendPrompt(gs, pid, ctx) {
    if (gs.step === 0 || !['draw', 'desc'].includes(gs.phase)) return;
    const a = this.albumOf(gs, pid, gs.step), prev = gs.albums[a].e[gs.step - 1];
    ctx.to(pid, { k: 'prompt', key: gs.step + ':' + a, type: prev.type, data: prev.data });
  },
  sendRev(gs, pid, ctx) {
    const al = gs.albums[gs.ra];
    for (let i = 0; i < gs.shown; i++) ctx.to(pid, { k: 'rev', key: gs.ra + ':' + i, e: al.e[i] });
  },
  commit(gs, ctx) {
    for (const pid of gs.ids) {
      const a = this.albumOf(gs, pid, gs.step);
      const s = gs.subs[pid];
      const e = s ? { pid, type: s.type, data: s.data } : gs.phase === 'draw' ? { pid, type: 'img', data: null } : { pid, type: 'text', data: gs.step === 0 ? pick(STARTERS) : '(pas de réponse)' };
      gs.albums[a].e.push(e);
    }
    gs.step++;
    if (gs.step >= gs.K) { gs.phase = 'reveal'; gs.ra = 0; gs.shown = 0; gs.end = null; this.reveal(gs, ctx); }
    else this.startStep(gs, ctx);
  },
  reveal(gs, ctx) {

/* ---------- 3. SYLLABOMBE ---------- */
const ALPHA = 'abcdefghijlmnopqrstuv';
const Dict = {
  set: null, p: null,
  load() {
    if (this.set) return Promise.resolve();
    if (this.p) return this.p;
    this.p = (async () => {
      const urls = ['https://cdn.jsdelivr.net/npm/an-array-of-french-words@2.0.0/index.json', 'mots-fr.json'];
      let arr = null;
      for (const u of urls) {
        try { const r = await fetch(u); if (r.ok) { const j = await r.json(); if (Array.isArray(j) && j.length > 1000) { arr = j; break; } } } catch (e) {}
      }
      if (!arr) { this.p = null; throw new Error('dictionnaire'); }
      const s = new Set();
      for (let i = 0; i < arr.length; i++) {
        const w0 = String(arr[i]).toLowerCase();
        if (!/[^a-zà-ÿœæ]/.test(w0)) { const w = letters(w0); if (w.length >= 2) s.add(w); }
        if (i % 50000 === 0) await new Promise(r => setTimeout(r, 0));
      }
      this.set = s;
    })();
    return this.p;
  }
};

  nextAlive(gs, from) { const o = gs.order; const i = o.indexOf(from); for (let k = 1; k <= o.length; k++) { const id = o[(i + k) % o.length]; if (gs.alive[id]) return id; } return null; },

/* ---------- outils communs question / réponse ---------- */
function topList(scores, n = 5) { return Object.entries(scores).map(([id, pts]) => ({ id, pts })).sort((a, b) => b.pts - a.pts).slice(0, n); }
function topHTML(top) { return `<div class="board-mini">${top.map((x, i) => `<div class="pl"><b style="width:20px">${i + 1}</b>${avatar(pl(x.id))}<span class="nm">${pnm(x.id)}</span><span class="pts">${x.pts}</span></div>`).join('')}</div>`; }
const QA = {
  /* gère la boucle question -> résultats -> question suivante */
  nextQ(def, gs, ctx) {
    gs.qi++;
    if (gs.qi >= gs.qs.length) { ctx.finish(gs, gs.scores); return; }
    gs.phase = 'q'; gs.ans = {}; gs.dur = gs.set.time * 1000; gs.end = Date.now() + gs.dur; gs.gain = {};
  },
  tick(def, gs, now, ctx) {
    if (gs.phase === 'q') {
      const on = ctx.online(gs.ids);
      if ((on.length && on.every(id => gs.ans[id] != null)) || now >= gs.end) { def.score(gs, ctx); gs.phase = 'res'; gs.dur = def.resTime || 9000; gs.end = now + gs.dur; return true; }
    } else if (gs.phase === 'res' && now >= gs.end) { QA.nextQ(def, gs, ctx); return true; }
    return false;
  },
  join(gs, pid) { gs.ids.push(pid); gs.scores[pid] = 0; },
  base(gs, pid, ctx) {
    const on = ctx.online(gs.ids);
    return { phase: gs.phase, qi: gs.qi, n: gs.qs.length, end: gs.end, dur: gs.dur, answered: on.filter(id => gs.ans[id] != null).length, total: on.length,
      my: gs.ans[pid] != null ? gs.ans[pid] : null, gain: gs.phase === 'res' ? (gs.gain[pid] || 0) : null, top: gs.phase === 'res' ? topList(gs.scores) : null, myScore: gs.scores[pid] || 0 };
  },
  head(v, label) {
    return `<div class="ghead"><span class="tag">${label} ${v.qi + 1}/${v.n}</span><span class="grow muted" id="qaCount"></span>${v.phase === 'q' ? timerEl() : hostBtn('qa-next', 'Suivant', 'small')}</div>${v.phase === 'q' ? tbarEl() : ''}`;
  },
  count(v) { const c = $('#qaCount'); if (c) c.textContent = v.phase === 'q' ? `${v.answered}/${v.total} ont répondu` : `Ton score : ${v.myScore}`; },
  gainBanner(v, extra = '') { return `<div class="banner ${v.gain > 0 ? 'ok' : 'bad'} center pop" style="font-size:1.2rem">${v.my == null ? 'Pas de réponse' : v.gain > 0 ? '+' + v.gain + ' points' : 'Raté !'}${extra}</div>`; }
};
function qaAction(gs, pid, a, ctx, valid) {
  if (a.a === 'next' && ctx.isHost(pid) && gs.phase === 'res') { gs.end = 0; return; }
  if (a.a === 'ans' && gs.phase === 'q' && gs.ans[pid] == null && valid(a.x)) gs.ans[pid] = a.x;
}

/* ---------- 4. QUIZ ÉCLAIR ---------- */
GAMES.quiz = {
  name: 'Quiz Éclair', color: '#e5383b', min: 1,
  desc: 'Quatre choix, réponds juste et vite.',
  rules: 'Une question, quatre réponses. Plus tu réponds vite, plus tu gagnes. Les séries de bonnes réponses rapportent un bonus.',
  settings: [
    { k: 'count', label: 'Questions', opts: [[10, '10'], [15, '15'], [20, '20']], def: 10 },
    { k: 'time', label: 'Temps', opts: [[10, '10 s'], [15, '15 s'], [20, '20 s']], def: 15 },
    { k: 'cats', label: 'Thèmes', multi: true, min: 1, opts: Object.entries(QUIZ_CATS), def: Object.keys(QUIZ_CATS) }
  ],
  create(ids, set, ctx) {
    let pool = QUIZ.filter(q => set.cats.includes(q[0])); if (!pool.length) pool = QUIZ;
    const qs = shuffle(pool).slice(0, set.count).map(q => { const ch = shuffle([q[2], q[3], q[4], q[5]]); return { cat: q[0], q: q[1], ch, ok: ch.indexOf(q[2]) }; });
    const gs = { ids: ids.slice(), set, qs, qi: -1, scores: Object.fromEntries(ids.map(i => [i, 0])), streak: {}, ans: {} };
    QA.nextQ(this, gs, ctx); return gs;
  },
  score(gs) {
    const Q = gs.qs[gs.qi];
    for (const id of gs.ids) {
      const a = gs.ans[id];
      if (a && a.c === Q.ok) {
        gs.streak[id] = (gs.streak[id] || 0) + 1;
        const g = 500 + Math.round(500 * Math.max(0, (gs.end - a.at) / gs.dur)) + 50 * (Math.min(gs.streak[id], 5) - 1);
        gs.gain[id] = g; gs.scores[id] += g;
      } else gs.streak[id] = 0;
    }
  },
  action(gs, pid, a, ctx) {
    if (a.a === 'ans') a.x = { c: a.c | 0, at: Date.now() };
    qaAction(gs, pid, a, ctx, x => x.c >= 0 && x.c < 4);
  },
  tick(gs, now, ctx) { return QA.tick(this, gs, now, ctx); },
  join: QA.join,
  view(gs, pid, ctx) {
    const Q = gs.qs[gs.qi], v = QA.base(gs, pid, ctx);
    v.my = gs.ans[pid] ? gs.ans[pid].c : null;
    Object.assign(v, { cat: QUIZ_CATS[Q.cat], q: Q.q, ch: Q.ch, streak: gs.streak[pid] || 0 });
    if (gs.phase === 'res') { v.ok = Q.ok; v.counts = [0, 1, 2, 3].map(c => Object.values(gs.ans).filter(a => a.c === c).length); }
    return v;
  },
  render(v) {
    scr('qz-' + v.qi + v.phase, `${QA.head(v, 'Question')}
      <p class="center" style="margin:14px 0 0"><span class="tag">${esc(v.cat)}</span></p>
      <div class="bigq">${esc(v.q)}</div>
      <div class="answers">${v.ch.map((c, i) => `<button class="ans a${i}" data-act="qz-ans" data-c="${i}"><span class="k">${'ABCD'[i]}</span><span>${esc(c)}</span></button>`).join('')}</div>
      <div id="qzRes" style="margin-top:16px"></div>`);
    QA.count(v);
    $$('.ans').forEach((b, i) => {
      b.classList.toggle('sel', v.my === i);
      if (v.phase === 'res') { b.classList.toggle('right', i === v.ok); b.classList.toggle('dim', i !== v.ok); b.disabled = true; }
      else { b.classList.toggle('dim', v.my != null && v.my !== i); b.disabled = v.my != null; }
    });
    const r = $('#qzRes');
    if (v.phase === 'res' && !r.dataset.done) {
      r.dataset.done = 1;
      if (v.gain > 0) sfx.ok(); else sfx.bad();
      const mx = Math.max(1, ...v.counts);
      r.innerHTML = `<div class="layout2"><div class="col">${QA.gainBanner(v, v.gain > 0 && v.streak > 1 ? ` · série de ${v.streak}` : '')}
        <div class="card distr">${v.ch.map((c, i) => `<div class="drow"><span style="width:22px;font-weight:800">${'ABCD'[i]}</span><span class="b a${i}" style="width:${8 + 70 * v.counts[i] / mx}%"></span><b>${v.counts[i]}</b></div>`).join('')}</div></div>
        <div class="card"><span class="label">Classement</span>${topHTML(v.top)}</div></div>`;
    }
  },
  click(a, b) { if (a === 'qz-ans') { act({ a: 'ans', c: +b.dataset.c }); beep(520, .06); } else if (a === 'qa-next') act({ a: 'next' }); }
};

  create(ids, set, ctx) {

      const m = new Map();

        const v = ((gs.ans[id] || [])[ci] || '').trim(); if (!v) continue;
        const k = norm(v);

  scoreRound(gs, ctx) {
    gs.rp = Object.fromEntries(gs.ids.map(i => [i, 0]));
    const voters = ctx.online(gs.ids).length;

    else if (a.a === 'stop' && gs.phase === 'play' && !gs.stopBy) {

    if (gs.phase === 'vote') {
      const on = ctx.online(gs.ids);
      if ((on.length && on.every(id => gs.ready[id])) || now >= gs.end) { this.advance(gs, ctx); return true; }
    }
    return false;

  view(gs, pid, ctx) {

    if (gs.phase === 'vote') {

      v.groups = gs.groups[gs.ci].map(g => ({ v: g.v, ids: g.ids, ok: g.ok, rej: Object.keys(g.rej).length, me: !!g.rej[pid], own: g.ids.includes(pid) }));

      v.mineAns = gs.cats.map((c, ci) => { const g = gs.groups[ci].find(g => g.ids.includes(pid)); return g ? { v: g.v, ok: g.final, pts: g.final ? (g.ids.length === 1 ? 10 : 5) : 0 } : null; });
    }

        <div class="ghead"><div class="bletter">${esc(v.letter)}</div><div class="grow"><span class="tag">Manche ${v.round}/${v.rounds}</span><h2 style="margin-top:6px">Des mots qui commencent par ${esc(v.letter)}</h2></div>${timerEl()}</div>
        ${tbarEl()}

/* ---------- 6. L'IMPOSTEUR ---------- */
GAMES.imposteur = {
  name: 'L’Imposteur', color: '#7b5cd6', min: 3,
  desc: 'Un joueur a un mot différent. Démasquez-le.',
  rules: 'Chacun reçoit un mot secret, mais un imposteur en a un autre, sans le savoir. Donne un indice d’un mot, puis votez pour éliminer le suspect.',
  settings: [
    { k: 'tclue', label: 'Temps d’indice', opts: [[30, '30 s'], [45, '45 s'], [60, '60 s']], def: 45 },
    { k: 'tvote', label: 'Temps de vote', opts: [[30, '30 s'], [45, '45 s'], [60, '60 s']], def: 45 },
    { k: 'imp', label: 'Imposteurs', opts: [['auto', 'Auto'], [1, '1'], [2, '2'], [3, '3']], def: 'auto' }
  ],
  create(ids, set, ctx) {
    const n = ids.length;
    let ni = set.imp === 'auto' ? (n >= 10 ? 2 : 1) : set.imp;
    ni = Math.max(1, Math.min(ni, Math.floor((n - 1) / 2)));
    let [w1, w2] = pick(PAIRS); if (Math.random() < .5) [w1, w2] = [w2, w1];
    const imp = shuffle(ids).slice(0, ni);
    const gs = { ids: ids.slice(), set, w1, w2, imp: Object.fromEntries(imp.map(i => [i, 1])), words: {}, alive: {}, clues: {}, round: 1 };
    ids.forEach(id => { gs.words[id] = gs.imp[id] ? w2 : w1; gs.alive[id] = true; gs.clues[id] = []; });
    this.startClue(gs); return gs;
  },
  startClue(gs) { gs.phase = 'clue'; gs.cur = {}; gs.dur = gs.set.tclue * 1000; gs.end = Date.now() + gs.dur; },
  aliveOn(gs, ctx) { return gs.ids.filter(id => gs.alive[id] && ctx.on(id)); },
  action(gs, pid, a, ctx) {
    if (!gs.alive[pid]) return;
    if (a.a === 'clue' && gs.phase === 'clue') {
      const x = String(a.x || '').trim().slice(0, 24); if (!x) return;
      const lx = letters(x), lw = letters(gs.words[pid]);
      if (lx.includes(lw) || (lx.length >= 3 && lw.includes(lx))) { ctx.to(pid, { k: 'bad', why: 'Ton indice ne doit pas contenir ton mot.' }); return; }
      gs.cur[pid] = x;
    } else if (a.a === 'vote' && gs.phase === 'vote' && gs.alive[a.id] && a.id !== pid) gs.votes[pid] = a.id;
  },
  resolve(gs, ctx) {
    const tally = {};
    for (const v of Object.values(gs.votes)) tally[v] = (tally[v] || 0) + 1;
    const max = Math.max(0, ...Object.values(tally));
    const top = Object.keys(tally).filter(k => tally[k] === max);
    gs.tally = tally; gs.outId = max > 0 && top.length === 1 ? top[0] : null;
    if (gs.outId) gs.alive[gs.outId] = false;
    gs.phase = 'out'; gs.dur = 6000; gs.end = Date.now() + gs.dur;
  },
  check(gs, ctx) {
    const al = gs.ids.filter(id => gs.alive[id]);
    const ni = al.filter(id => gs.imp[id]).length, nc = al.length - ni;
    let win = null;
    if (ni === 0) win = 'civ'; else if (ni >= nc || gs.round >= gs.ids.length) win = 'imp';
    if (!win) { gs.round++; this.startClue(gs); return; }
    const sc = Object.fromEntries(gs.ids.map(id => [id, 0]));
    gs.ids.forEach(id => { if (win === 'civ' && !gs.imp[id]) sc[id] = 300; if (win === 'imp' && gs.imp[id]) sc[id] = 500; });
    const imps = gs.ids.filter(id => gs.imp[id]).map(id => esc(ctx.name(id))).join(', ');
    gs.endNote = `${win === 'civ' ? 'Les civils gagnent !' : 'L’imposteur gagne !'} Mot des civils : <b>${esc(gs.w1)}</b> · mot de l’imposteur : <b>${esc(gs.w2)}</b><br>Imposteur${imps.includes(',') ? 's' : ''} : ${imps}`;
    ctx.finish(gs, sc);
  },
  tick(gs, now, ctx) {
    const al = this.aliveOn(gs, ctx);
    if (gs.phase === 'clue' && ((al.length && al.every(id => gs.cur[id])) || now >= gs.end)) {
      gs.ids.forEach(id => { if (gs.alive[id]) gs.clues[id].push(gs.cur[id] || '…'); });
      gs.phase = 'vote'; gs.votes = {}; gs.dur = gs.set.tvote * 1000; gs.end = now + gs.dur; return true;
    }
    if (gs.phase === 'vote' && ((al.length && al.every(id => gs.votes[id])) || now >= gs.end)) { this.resolve(gs, ctx); return true; }
    if (gs.phase === 'out' && now >= gs.end) { this.check(gs, ctx); return true; }
    return false;
  },
  view(gs, pid, ctx) {
    const al = this.aliveOn(gs, ctx);
    const v = { phase: gs.phase, round: gs.round, word: gs.words[pid], meAlive: !!gs.alive[pid], end: gs.end, dur: gs.dur,
      players: gs.ids.map(id => ({ id, a: !!gs.alive[id], c: gs.clues[id] })) };
    if (gs.phase === 'clue') { v.myClue = gs.cur[pid] || null; v.n = al.filter(id => gs.cur[id]).length; v.total = al.length; }
    if (gs.phase === 'vote') { v.myVote = gs.votes[pid] || null; v.n = al.filter(id => gs.votes[id]).length; v.total = al.length; }
    if (gs.phase === 'out') { v.outId = gs.outId; v.outImp = gs.outId ? !!gs.imp[gs.outId] : null; v.tally = gs.tally; }
    return v;
  },
  onEv(e) { if (e.k === 'bad') { sfx.bad(); toast(e.why); } },
  render(v) {
    scr('imp-' + v.round + v.phase, `
      <div class="ghead"><span class="tag">Tour ${v.round}</span><h2 class="grow">${{ clue: 'Donne un indice', vote: 'Qui est l’imposteur ?', out: 'Verdict' }[v.phase]}</h2>${v.phase !== 'out' ? timerEl() : ''}</div>
      <div class="center" style="margin:6px 0 4px"><span class="label">Ton mot secret</span><br><span class="myword">${esc(v.word)}</span></div>
      <p class="center muted" style="margin:10px 0 16px">Tu ne sais pas si tu es l’imposteur.</p>
      <div id="impZone" style="max-width:640px;margin:0 auto 16px"></div>
      <div class="vlist" id="impList"></div>`);
    const z = $('#impZone');
    if (v.phase === 'clue') {
      if (!v.meAlive) z.innerHTML = '<div class="banner center">Tu es éliminé : observe les indices.</div>';
      else if (v.myClue) z.innerHTML = `<div class="banner ok center">Ton indice : <b>${esc(v.myClue)}</b> · ${v.n}/${v.total} ont répondu</div>`;
      else if (!z.querySelector('form')) {
        z.innerHTML = `<form class="row" id="impForm"><input class="field grow" id="impIn" maxlength="24" autocomplete="off" placeholder="Un seul mot, sans dire ton mot"><button class="btn go big" type="submit">Envoyer</button></form>`;
        $('#impForm').addEventListener('submit', e => { e.preventDefault(); const i = $('#impIn'); if (i.value.trim()) act({ a: 'clue', x: i.value }); });
        $('#impIn').focus();
      }
    } else if (v.phase === 'vote') {
      z.innerHTML = v.meAlive ? `<div class="banner center">${v.myVote ? 'Vote enregistré : ' + pnm(v.myVote) + '. Tu peux changer.' : 'Touche le joueur que tu soupçonnes.'} · ${v.n}/${v.total}</div>` : '<div class="banner center">Tu es éliminé : tu ne votes plus.</div>';
    } else {
      if (!z.dataset.k) { z.dataset.k = 1; if (v.outId) (v.outImp ? sfx.ok : sfx.bad)(); }
      z.innerHTML = v.outId ? `<div class="banner ${v.outImp ? 'ok' : 'bad'} center pop" style="font-size:1.2rem"><b>${pnm(v.outId)}</b> est éliminé… ${v.outImp ? 'c’était un imposteur !' : 'c’était un civil.'}</div>` : '<div class="banner center pop">Égalité : personne n’est éliminé.</div>';
    }
    const canVote = v.phase === 'vote' && v.meAlive;
    $('#impList').innerHTML = v.players.map(p => {
      const P = pl(p.id), can = canVote && p.a && p.id !== S.me.id;
      return `<button class="vp ${can ? 'can' : ''} ${v.myVote === p.id ? 'sel' : ''} ${p.a ? '' : 'out'}" ${can ? `data-act="imp-vote" data-id="${esc(p.id)}"` : 'disabled'}>
        <span class="row">${avatar(P)}<b class="grow" style="overflow:hidden;text-overflow:ellipsis">${esc(P.name)}${p.id === S.me.id ? ' (toi)' : ''}</b>${v.phase === 'out' && v.tally && v.tally[p.id] ? `<span class="tag">${v.tally[p.id]} vote${v.tally[p.id] > 1 ? 's' : ''}</span>` : ''}</span>
        <span class="clues">${p.c.map(c => `<span>${esc(c)}</span>`).join('') || '<span class="muted" style="border:0;background:none">pas encore d’indice</span>'}</span></button>`;
    }).join('');
  },
  click(a, b) { if (a === 'imp-vote') act({ a: 'vote', id: b.dataset.id }); }
};

/* ---------- 7. AU PLUS PRÈS ---------- */
const fmtNum = n => Number(n).toLocaleString('fr-FR', { maximumFractionDigits: 2 });
GAMES.estim = {
  name: 'Au Plus Près', color: '#22a45d', min: 1,
  desc: 'Estime un nombre : le plus proche gagne.',
  rules: 'Une question, un nombre. Personne ne connaît la réponse exacte ? Pas grave : plus tu es proche, plus tu marques.',
  settings: [
    { k: 'count', label: 'Questions', opts: [[5, '5'], [8, '8'], [10, '10'], [15, '15']], def: 8 },
    { k: 'time', label: 'Temps', opts: [[15, '15 s'], [20, '20 s'], [30, '30 s']], def: 20 }
  ],
  create(ids, set, ctx) {
    const gs = { ids: ids.slice(), set, qs: shuffle(ESTIM).slice(0, set.count), qi: -1, scores: Object.fromEntries(ids.map(i => [i, 0])), ans: {} };
    QA.nextQ(this, gs, ctx); return gs;
  },
  score(gs) {
    const A = gs.qs[gs.qi][1];
    const ids = Object.keys(gs.ans);
    const dist = id => Math.abs(gs.ans[id] - A);
    const best = ids.length ? Math.min(...ids.map(dist)) : null;
    for (const id of ids) {
      const err = dist(id) / Math.max(Math.abs(A), 1);
      let g = Math.round(400 * Math.max(0, 1 - 2 * err));
      if (dist(id) === best) g += 200;
      if (dist(id) === 0) g += 100;
      gs.gain[id] = g; gs.scores[id] += g;
    }
  },
  action(gs, pid, a, ctx) { if (a.a === 'ans') a.x = Number(a.x); qaAction(gs, pid, a, ctx, x => Number.isFinite(x) && Math.abs(x) < 1e13); },
  tick(gs, now, ctx) { return QA.tick(this, gs, now, ctx); },
  join: QA.join,
  view(gs, pid, ctx) {
    const Q = gs.qs[gs.qi], v = QA.base(gs, pid, ctx);
    Object.assign(v, { q: Q[0], unit: Q[2] });
    if (gs.phase === 'res') { v.answer = Q[1]; v.rows = Object.keys(gs.ans).map(id => ({ id, x: gs.ans[id], g: gs.gain[id] || 0 })).sort((a, b) => Math.abs(a.x - Q[1]) - Math.abs(b.x - Q[1])).slice(0, 10); }
    return v;
  },
  render(v) {
    scr('es-' + v.qi + v.phase, `${QA.head(v, 'Question')}
      <div class="bigq">${esc(v.q)}</div>
      <div id="esZone" style="max-width:640px;margin:0 auto"></div>`);
    QA.count(v);
    const z = $('#esZone');
    if (v.phase === 'q') {
      if (v.my != null) z.innerHTML = `<div class="banner ok center">Ta réponse : <b>${fmtNum(v.my)} ${esc(v.unit)}</b></div>`;
      else if (!z.querySelector('form')) {
        z.innerHTML = `<form class="row" id="esForm"><input class="field grow bigin" id="esIn" inputmode="decimal" autocomplete="off" placeholder="Ton estimation"><span style="font-weight:700">${esc(v.unit)}</span><button class="btn go big" type="submit">Valider</button></form><div class="err" id="esErr"></div>`;
        $('#esForm').addEventListener('submit', e => {
          e.preventDefault();
          const raw = $('#esIn').value.replace(/\s| /g, '').replace(',', '.');
          const n = Number(raw);
          if (!raw || !Number.isFinite(n)) { $('#esErr').textContent = 'Écris un nombre, par exemple 1250 ou 3,5.'; return; }
          act({ a: 'ans', x: n });
        });
        $('#esIn').focus();
      }
    } else if (!z.dataset.done) {
      z.dataset.done = 1; if (v.gain > 0) sfx.ok();
      z.innerHTML = `<div class="col"><div class="center"><span class="label">Réponse</span><br><span class="myword">${fmtNum(v.answer)} ${esc(v.unit)}</span></div>
        ${QA.gainBanner(v)}
        <div class="card"><span class="label">Les plus proches</span><div class="plist" style="margin-top:8px">${v.rows.map((r, i) => `<div class="pl" ${r.id === S.me.id ? 'style="background:#fff1c2"' : ''}><b style="width:20px">${i + 1}</b>${avatar(pl(r.id))}<span class="nm">${pnm(r.id)}</span><span class="muted">${fmtNum(r.x)}</span><span class="pts">+${r.g}</span></div>`).join('') || '<p class="muted">Aucune réponse.</p>'}</div></div></div>`;
    }
  },
  click(a) { if (a === 'qa-next') act({ a: 'next' }); }
};

/* ---------- 8. TU PRÉFÈRES ---------- */
GAMES.prefs = {
  name: 'Tu préfères ?', color: '#e5579a', min: 2,
  desc: 'Deux choix impossibles, la classe tranche.',
  rules: 'Choisis entre deux options. Ceux qui sont dans la majorité marquent 100 points. Pas de bonne réponse, juste des débats !',
  resTime: 8000,
  settings: [
    { k: 'count', label: 'Questions', opts: [[8, '8'], [12, '12'], [16, '16'], [20, '20']], def: 12 },
    { k: 'time', label: 'Temps', opts: [[10, '10 s'], [15, '15 s'], [20, '20 s']], def: 15 }
  ],
  create(ids, set, ctx) {
    const qs = shuffle(PREFS).slice(0, set.count).map(p => Math.random() < .5 ? p : [p[1], p[0]]);
    const gs = { ids: ids.slice(), set, qs, qi: -1, scores: Object.fromEntries(ids.map(i => [i, 0])), ans: {} };
    QA.nextQ(this, gs, ctx); return gs;
  },
  score(gs) {
    const a = Object.values(gs.ans).filter(x => x === 0).length, b = Object.values(gs.ans).filter(x => x === 1).length;
    if (a === b) return;
    const maj = a > b ? 0 : 1;
    for (const id in gs.ans) if (gs.ans[id] === maj) { gs.gain[id] = 100; gs.scores[id] += 100; }
  },
  action(gs, pid, a, ctx) { qaAction(gs, pid, a, ctx, x => x === 0 || x === 1); },
  tick(gs, now, ctx) { return QA.tick(this, gs, now, ctx); },
  join: QA.join,
  view(gs, pid, ctx) {
    const Q = gs.qs[gs.qi], v = QA.base(gs, pid, ctx);
    Object.assign(v, { opts: Q });
    if (gs.phase === 'res') { v.ids = [0, 1].map(c => Object.keys(gs.ans).filter(id => gs.ans[id] === c)); }
    return v;
  },
  render(v) {
    scr('pf-' + v.qi + v.phase, `${QA.head(v, 'Dilemme')}
      <div class="bigq">Tu préfères…</div>
      <div class="duel">${v.opts.map((o, i) => `<button class="opt ${'AB'[i]}" data-act="pf-ans" data-c="${i}"><span>${esc(o)}<span class="pct" id="pfP${i}" style="display:block"></span><span class="row" id="pfN${i}" style="gap:4px;justify-content:center;margin-top:8px"></span></span></button>`).join('')}</div>
      <div id="pfRes" style="max-width:520px;margin:14px auto 0"></div>`);
    QA.count(v);
    $$('.opt').forEach((b, i) => { b.classList.toggle('sel', v.my === i); b.classList.toggle('dim', v.my != null && v.my !== i); b.disabled = v.my != null || v.phase === 'res'; });
    if (v.phase === 'res' && !$('#pfRes').dataset.done) {
      $('#pfRes').dataset.done = 1;
      const tot = Math.max(1, v.ids[0].length + v.ids[1].length);
      [0, 1].forEach(i => { $('#pfP' + i).textContent = Math.round(100 * v.ids[i].length / tot) + ' %'; });
      [0, 1].forEach(i => { $('#pfN' + i).innerHTML = v.ids[i].map(id => avatar(pl(id))).join(''); });
      $('#pfRes').innerHTML = QA.gainBanner(v, '').replace('Raté !', 'Minorité : 0 point');
      if (v.gain > 0) sfx.ok();
    }
  },
  click(a, b) { if (a === 'pf-ans') act({ a: 'ans', x: +b.dataset.c }); else if (a === 'qa-next') act({ a: 'next' }); }
};

/* ===================== DÉMARRAGE ===================== */
render();
(function autoRejoin() {
  const code = (new URLSearchParams(location.search).get('salle') || '').toUpperCase();
  let mem = ''; try { mem = sessionStorage.getItem('ra-room') || ''; } catch (e) {}
  if (code && mem === code && S.me.name) joinRoom(code);
})();
</script>
